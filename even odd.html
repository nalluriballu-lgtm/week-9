<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>even odd</title>
</head>
<body>
    <script>
        
let n = 7;

if (n % 2 === 0) {
    console.log("Even Number");
    document.write("even number<br>");
} else {
    console.log("Odd Number");
    document.write("odd number");
}

    </script>
</body>
</html>
