<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>prime</title>
</head>
<body>
   <script>
let n = 7;
let flag = 0;

if (n <= 1) {
    console.log("Not a Prime Number");
} else {
    for (let i = 2; i < n; i++) {
        if (n % i === 0) {
            flag = 1;
            break;
        }
    }

    if (flag === 0) {
        console.log("Prime Number");
        document.write("prime number<br>");
    } else {
        console.log("Not a Prime Number");
        document.write("not prime number");
    }
}
  </script> 
    
</body>
</html>
