<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>fibnacci</title>
</head>
<body>
    <script>
        
let n = 10;
let a = 0, b = 1;

console.log(a);
console.log(b);

for (let i = 3; i <= n; i++) {
    let c = a + b;
    console.log(c);
    document.write(c +"<br>");
    a = b;
    b = c;
}

    </script>
</body>
</html>
